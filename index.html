<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#fff1e4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="포켓 펫" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <title>포켓 펫 (가제)</title>
  <style>
    :root { --ink: #3b2c35; --cream: #fff7ec; --pink: #ff9fb2; --deep: #e86a8a; --bar: #fff1e4; --line: #e8cdb8; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #ffe3cf; color: var(--ink); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; overscroll-behavior: none; }
    button { font: inherit; color: inherit; cursor: pointer; }
    #app { height: 100dvh; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bar); position: relative; overflow: hidden; }
    header { display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 10px) 16px 8px; }
    header .name { font-weight: 800; font-size: 18px; }
    header .sub { font-size: 12px; opacity: .7; }
    header .clock { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
    .iconbtn { border: 0; background: var(--cream); width: 38px; height: 38px; border-radius: 10px; box-shadow: 0 2px 0 var(--line); font-size: 18px; }
    #stage { flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; background: #ffe3cf; }
    #room { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    #stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 8px 12px 0; }
    .stat { position: relative; background: var(--cream); border-radius: 10px; padding: 4px 0 7px; text-align: center; font-size: 11px; overflow: hidden; box-shadow: 0 2px 0 var(--line); }
    .stat b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
    .stat i { position: absolute; left: 0; bottom: 0; height: 4px; background: #8fd694; }
    .stat.mid i { background: #ffd866; } .stat.low i { background: #ff6b6b; } .stat.low b { color: #d64545; }
    #msg { height: 44px; padding: 6px 16px 0; font-size: 14px; line-height: 19px; text-align: center; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; } /* 높이 고정: 문구 길이에 따라 방이 튀지 않게 */
    nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 6px 12px calc(env(safe-area-inset-bottom) + 12px); }
    nav button { border: 0; border-radius: 16px; background: var(--cream); box-shadow: 0 3px 0 var(--line); padding: 8px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; }
    nav button:active, .big:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
    nav canvas { width: 30px; height: 24px; image-rendering: pixelated; }
    #backdrop { position: absolute; inset: 0; background: rgba(59,44,53,.35); }
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 85%; overflow: auto; background: var(--bar); border-radius: 20px 20px 0 0; padding: 18px 18px calc(env(safe-area-inset-bottom) + 18px); box-shadow: 0 -4px 20px rgba(0,0,0,.15); }
    .sheet h2 { margin: 0 0 12px; font-size: 18px; }
    .sheet label { display: block; margin: 12px 0; font-size: 14px; font-weight: 600; }
    .sheet label.check { display: flex; gap: 8px; align-items: center; font-weight: 500; }
    .sheet select, .sheet input[type=time], #name-input { font: inherit; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: #fff; margin-top: 4px; }
    .sheet select { width: 100%; }
    .row { display: flex; gap: 6px; align-items: center; }
    .big { display: block; width: 100%; border: 0; border-radius: 14px; background: var(--deep); color: #fff; padding: 14px; font-weight: 800; font-size: 16px; margin: 10px 0; box-shadow: 0 3px 0 #b84d6b; }
    .big.ghost { background: var(--cream); color: var(--ink); box-shadow: 0 3px 0 var(--line); }
    .big.danger { color: #c0392b; }
    .small { font-size: 13px; } .dim { opacity: .6; } .warn { background: #fff3c4; padding: 10px; border-radius: 10px; } .ok { background: #dff5e1; padding: 10px; border-radius: 10px; font-weight: 700; }
    .sheet ol { padding-left: 20px; line-height: 1.6; font-size: 14px; }
    #start { position: absolute; inset: 0; background: #ffe3cf; display: flex; align-items: center; justify-content: center; padding: 24px; }
    #start .step { width: 100%; max-width: 380px; text-align: center; }
    #start h1 { font-size: 22px; margin: 0 0 6px; } #start p { margin: 0 0 18px; opacity: .8; }
    .choices { display: grid; gap: 12px; }
    .choice { border: 0; border-radius: 18px; background: var(--cream); box-shadow: 0 3px 0 var(--line); padding: 16px; text-align: left; }
    .choice b { display: block; font-size: 17px; margin-bottom: 2px; } .choice span { font-size: 13px; opacity: .75; }
    #name-input { width: 100%; font-size: 18px; text-align: center; margin-bottom: 8px; }
    #mg { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, rgba(255,241,228,.96) 30%); padding: 40px 16px calc(env(safe-area-inset-bottom) + 16px); text-align: center; }
    #mg-text { font-weight: 800; font-size: 17px; margin-bottom: 8px; }
    #mg-dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
    #mg-dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); display: block; }
    #mg-dots i.hit { background: #4fae7a; } #mg-dots i.miss { background: #ff6b6b; }
    .mg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .mg-row button { border: 0; border-radius: 18px; background: var(--deep); color: #fff; font-size: 22px; font-weight: 900; padding: 22px 0; box-shadow: 0 4px 0 #b84d6b; }
    .mg-row button:active { transform: translateY(3px); box-shadow: 0 1px 0 #b84d6b; }
    #mg-quit { margin-top: 10px; background: none; border: 0; text-decoration: underline; opacity: .7; }
    #ending { position: absolute; inset: 0; background: rgba(59,44,53,.45); display: flex; align-items: center; justify-content: center; padding: 20px; }
    #ending .card { background: #fffaf2; border-radius: 22px; padding: 20px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
    #ending canvas { width: 112px; height: 92px; image-rendering: pixelated; margin: 4px auto 8px; display: block; }
    #ending-letter { white-space: pre-line; text-align: left; background: #fff; border: 1px dashed var(--line); border-radius: 12px; padding: 14px; line-height: 1.6; font-size: 15px; }
    .dex { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .dex figure { margin: 0; background: var(--cream); border-radius: 12px; padding: 6px 2px; text-align: center; font-size: 12px; box-shadow: 0 2px 0 var(--line); }
    .dex figure.unseen { opacity: .7; }
    .dex canvas, .pastrow canvas { width: 84px; height: 69px; image-rendering: pixelated; display: block; margin: 0 auto; }
    .sheet h3 { font-size: 15px; margin: 16px 0 8px; }
    .pastrow { display: flex; gap: 10px; align-items: center; background: var(--cream); border-radius: 12px; padding: 6px 10px; margin-bottom: 8px; }
    .pastrow canvas { width: 56px; height: 46px; margin: 0; }
    #save-code { width: 100%; height: 90px; font: 12px ui-monospace, monospace; border-radius: 10px; border: 1px solid var(--line); padding: 8px; word-break: break-all; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div>
        <div class="name" id="petname">포켓 펫</div>
        <div class="sub" id="sub"></div>
      </div>
      <div class="clock" id="clock"></div>
      <button class="iconbtn" id="btn-menu" aria-label="메뉴">≡</button>
    </header>
    <main id="stage"><canvas id="room"></canvas></main>
    <div id="stats"></div>
    <div id="msg"></div>
    <nav>
      <button data-icon="iconFood" data-act="food"><canvas></canvas><span>밥</span></button>
      <button data-icon="iconPlay" data-act="play"><canvas></canvas><span>놀기</span></button>
      <button data-icon="iconWash" data-act="wash"><canvas></canvas><span>씻기</span></button>
      <button data-icon="iconLight" data-act="light" id="btn-light"><canvas></canvas><span>불 끄기</span></button>
      <button data-icon="iconMedicine" data-act="medicine"><canvas></canvas><span>약</span></button>
    </nav>

    <div id="backdrop" hidden></div>
    <section class="sheet" data-sheet="menu" hidden>
      <h2>메뉴</h2>
      <button class="big ghost" data-open="dex">도감</button>
      <button class="big ghost" data-open="notify">알림</button>
      <button class="big ghost" data-open="settings">설정</button>
      <button class="big ghost" data-open="save">저장 (기기 옮기기)</button>
      <button class="big ghost" data-close>닫기</button>
    </section>
    <section class="sheet" data-sheet="food" hidden>
      <h2>무엇을 줄까요?</h2>
      <button class="big" data-act="meal">밥 (배부름 +30)</button>
      <button class="big ghost" data-act="snack">간식 (기분 +15, 너무 많이 주면 배탈)</button>
    </section>
    <section class="sheet" data-sheet="notify" hidden>
      <h2>알림</h2>
      <div id="notify-body"></div>
      <button class="big ghost" data-close>닫기</button>
    </section>
    <section class="sheet" data-sheet="settings" hidden>
      <h2>설정</h2>
      <div id="settings-body"></div>
      <button class="big ghost" data-close>닫기</button>
    </section>

    <section class="sheet" data-sheet="dex" hidden>
      <h2>도감</h2>
      <div id="dex-body"></div>
      <div id="dex-retire"></div>
      <button class="big ghost" data-close>닫기</button>
    </section>
    <section class="sheet" data-sheet="save" hidden>
      <h2>저장 (기기 옮기기)</h2>
      <p class="small">다른 휴대폰이나 홈 화면 앱으로 옮길 때 써요. <b>내보내기</b>로 코드를 복사하고, 옮길 곳에서 코드를 붙여 넣은 뒤 <b>불러오기</b>를 눌러요.</p>
      <button class="big" id="btn-export">내보내기 (코드 복사)</button>
      <textarea id="save-code" placeholder="여기에 저장 코드를 붙여 넣으세요"></textarea>
      <button class="big ghost" id="btn-import">불러오기</button>
      <p class="small" id="save-msg"></p>
      <button class="big ghost" data-close>닫기</button>
    </section>
    <div id="mg" hidden>
      <div id="mg-text"></div>
      <div id="mg-dots"></div>
      <div class="mg-row"><button id="mg-left" aria-label="왼쪽">◀ 왼쪽</button><button id="mg-right" aria-label="오른쪽">오른쪽 ▶</button></div>
      <button id="mg-quit">그만하기</button>
    </div>
    <div id="ending" hidden>
      <div class="card">
        <h2 id="ending-title"></h2>
        <canvas id="ending-portrait" width="56" height="46"></canvas>
        <div id="ending-letter"></div>
        <p class="small dim" id="ending-meta"></p>
        <button class="big" id="btn-ending">도감에 남기고 새 알 받기</button>
      </div>
    </div>
    <div id="start" hidden>
      <div class="step" data-step="theme">
        <h1>어떤 알을 키울까요?</h1>
        <p>알에 따라 자라는 친구들이 달라요</p>
        <div class="choices">
          <button class="choice" data-theme="animal"><b>점박이 알 · 동물</b><span>털뭉치 → 강아지·고양이 → 시바, 코기, 여우 고양이…</span></button>
          <button class="choice" data-theme="fantasy"><b>무지개 알 · 상상 속 생물</b><span>말랑이 → 아기 용·꼬마 구름 → 무지개 용, 구름 고래…</span></button>
        </div>
      </div>
      <div class="step" data-step="speed" hidden>
        <h1>얼마나 빨리 자랄까요?</h1>
        <p>빠를수록 자주 챙겨야 해요. 나중에 설정에서 바꿀 수 있어요</p>
        <div class="choices">
          <button class="choice" data-speed="slow"><b>느긋</b><span>어른까지 약 6일 · 하루 1~2번 들여다보기</span></button>
          <button class="choice" data-speed="normal"><b>보통</b><span>어른까지 약 3일 · 하루 3~4번</span></button>
          <button class="choice" data-speed="fast"><b>빠름</b><span>어른까지 약 1일 · 2시간마다</span></button>
        </div>
      </div>
      <div class="step" data-step="name" hidden>
        <h1>이름을 지어 주세요</h1>
        <p>최대 6글자</p>
        <input id="name-input" maxlength="6" autocomplete="off" placeholder="토리" />
        <button class="big" id="btn-start">시작하기</button>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js?v=106e0a7-1791169146"></script>
</body>
</html>
